<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOXES</title>
    <style>
        div, span, section, h1, p, a, b, code, mark{
            background-color: aquamarine;
            display: inline;
        }
    </style>
</head>
<body>
    <!-- o código não tem semântica hoje -->
    <div>BLOCK - MARCAÇÃO DE DIV</div>
    <span>INLINE - MCARCAÇÃO DE SPAN</span>
    <section>BLOCK - MARCAÇÃO DE SECTION</section>
    <h1>BLOCK - MARCAÇÃO DE H1</h1>
    <p>BLOCK - MARCAÇÃO DE PARÁGRAFO</p>
    <a href="">INLINE - MARCAÇÃO DE ÂNCORA</a>
    <b>INLINE - MARCAÇÃO DE B (negrito)</b>
    <code>INLINE - MARCAÇÃO DE CODE</code>
    <mark>INLINE - MARCAÇÃO DE MARK</mark>
    <!-- 
    COMPORTAMENTO NATIVO
    MARCAÇÕES BLOCK: ocupam o bloco todo (de uma ponta a outra da página)
    MARCAÇÃO INLINE: ocupam apenas os seus caracteres
    -->
</body>
</html>
